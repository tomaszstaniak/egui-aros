[package]
name = "egui-aros-glow-probe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Minimal eframe/glow program: does the standard egui desktop stack run on AROS?"

[dependencies]
egui = { version = "=0.37.0", default-features = false }
# The C helper that reports the task's signals.
egui-aros = { path = "../../crates/egui-aros" }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts"] }

