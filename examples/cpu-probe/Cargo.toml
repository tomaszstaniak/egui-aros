[package]
name = "egui-aros-cpu-probe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The probe scene on egui-aros: winit and egui-winit with the CPU renderer"

[features]
# The same scene drawn with OpenGL through egui-aros.
glow = ["egui-aros/glow"]
# Test builds: EGUI_AROS_TEST_GL_FAILURE makes the OpenGL context fail.
gl-failure-test = ["glow", "egui-aros/gl-failure-test"]

[dependencies]
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui-aros = { path = "../../crates/egui-aros" }
